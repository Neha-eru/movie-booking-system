# ===========================
# Application Config
# ===========================
spring.application.name=movie-booking-backend
server.port=8080

# ===========================
# MySQL Database Config
# ===========================
spring.datasource.url=jdbc:mysql://localhost:3306/movie_booking_db1?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===========================
# JPA / Hibernate Config
# ===========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===========================
# JWT Config
# ===========================
# Must be at least 32 characters (256 bits) for HS256
jwt.secret=moviebooking_super_secret_key_must_be_32chars_min
jwt.expiration=86400000

# ===========================
# SQL Init (Sample Data)
# IMPORTANT: Set to 'never' after first run to avoid duplicate inserts
# ===========================
spring.sql.init.mode=never

# ===========================
# Jackson (LocalDate/Time serialization)
# ===========================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd

# ===========================
# Logging
# ===========================
logging.level.com.moviebooking=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG